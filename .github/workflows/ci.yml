name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build / TypeScript / ESLint / format / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - name: Bundle size report
        run: npm run bundle:report
      - name: Measure seeded engine CPU throughput (informational)
        run: npm run perf:benchmark
      - name: Upload performance artifact
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: wild-life-performance-snapshot
          path: reports/performance.json
          retention-days: 30
      - name: Upload bundle baseline artifact
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: wild-life-bundle-snapshot
          path: reports/bundle.json
          retention-days: 30
