name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build / TypeScript / ESLint / format / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # Bootstrap the new lint dependency graph on this initial PR.
      # After the lockfile from this run is committed, switch to npm ci only.
      - name: Resolve lint dependencies for lockfile update
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-candidate
          path: package-lock.json
          retention-days: 7
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - name: Bundle size report
        run: npm run bundle:report
      - name: Upload bundle baseline artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wild-life-bundle-snapshot
          path: reports/bundle.json
          retention-days: 30
