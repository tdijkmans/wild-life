name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build / TypeScript / ESLint / format / tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Format new world and audio sources (temporary branch bootstrap)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npx prettier --write .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --staged --quiet; then
            git commit -m "style: format new living worlds and procedural audio"
            git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
          fi
      - name: Agent guidance integrity
        run: npm run agent:check
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - name: Bundle size report
        run: npm run bundle:report
      - name: Measure seeded engine CPU throughput (informational)
        run: npm run perf:benchmark
      - name: Upload performance artifact
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: wild-life-performance-snapshot
          path: reports/performance.json
          retention-days: 30
      - name: Upload bundle baseline artifact
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: wild-life-bundle-snapshot
          path: reports/bundle.json
          retention-days: 30

  e2e:
    name: Chromium browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and experiment replay
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: wild-life-playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
