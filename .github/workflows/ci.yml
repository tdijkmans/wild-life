name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build / TypeScript / ESLint / format / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # Bootstrap the new lint dependency graph on this initial PR.
      # After the lockfile from this run is committed, switch to npm ci only.
      - name: Resolve lint dependencies for lockfile update
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Format new CI files
        run: npx prettier --write package.json eslint.config.cjs scripts/report-bundle.mjs docs/quality-gates.md .github/workflows/ci.yml
      - name: Commit bootstrapped lockfile and formatting (one-time setup)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json eslint.config.cjs scripts/report-bundle.mjs docs/quality-gates.md .github/workflows/ci.yml
          if ! git diff --staged --quiet; then
            git commit -m "ci: lock lint dependencies and format quality tooling"
            git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
          fi
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - name: Bundle size report
        run: npm run bundle:report
      - name: Upload bundle baseline artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wild-life-bundle-snapshot
          path: reports/bundle.json
          retention-days: 30
